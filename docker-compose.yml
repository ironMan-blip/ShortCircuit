# docs/PLAN.md §10.1, §11. Images are pinned: upgrade on purpose, after the release notes.
# Containers get state/.env.live, the copy that scripts/apply-env.sh checked and wrote.
# Compose reads it on the host; no container mounts state/. Run apply-env.sh once before
# the first `docker compose up -d`.
# Values below are fixed by the plan; `environment` wins over env_file, so .env cannot change them.

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    env_file: [state/.env.live]  # POSTGRES_PASSWORD, POSTGRES_APP_PASSWORD (read at first init only)
    environment:
      POSTGRES_DB: n8n
    volumes:
      - pg:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.49.7
    restart: unless-stopped
    env_file: [state/.env.live]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres  # DB_POSTGRESDB_PASSWORD comes from .env.live (set by apply-env.sh)
      N8N_PROXY_HOPS: "1"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_RESTRICT_FILE_ACCESS_TO: /data
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_TIMEOUT: "4800"
      EXECUTIONS_TIMEOUT_MAX: "4800"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    ports:
      - "127.0.0.1:5678:5678"  # localhost only; tailscale serve passes tailnet HTTPS to it
    volumes:
      - n8n_home:/home/node/.n8n
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8880/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  # §5. API on renderer:8000 and the checking proxy on renderer:8899, Docker network only (no
  # published port). Own env file, so an .env change never recreates it mid-render.
  renderer:
    build: ./renderer
    image: shortcircuit-renderer
    restart: unless-stopped
    env_file: [renderer.env]  # PEXELS_API_KEY, KOKORO_URL
    security_opt:
      # Docker's default profile + the user-namespace syscalls Chromium's sandbox needs.
      - seccomp=./renderer/seccomp.json
    volumes:
      - ./data:/data
      - ./assets:/assets:ro
    depends_on:
      kokoro:
        condition: service_started

volumes:
  pg:
  n8n_home:
